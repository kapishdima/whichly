<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Optio runtime smoke test</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        padding: 0;
      }
      section {
        padding: 48px 32px;
        border-bottom: 1px solid #eee;
      }
      .hero-bold {
        background: #111;
        color: #fff;
      }
      .hero-bold h1 {
        font-size: 56px;
        margin: 0;
      }
      .hero-quiet {
        background: #fafafa;
        color: #333;
      }
      .hero-quiet h1 {
        font-size: 28px;
        font-weight: 400;
        margin: 0;
      }
      .pricing-cards {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }
      .pricing-table {
        display: flex;
        flex-direction: column;
      }
      .card {
        background: #f3f4f6;
        padding: 24px;
        border-radius: 8px;
      }
      .row {
        padding: 12px;
        border-bottom: 1px solid #ddd;
      }
      .controls {
        padding: 16px 32px;
        background: #fff8dc;
      }
      .controls button {
        padding: 8px 14px;
      }
    </style>

    <!-- FOUC styles that React layer would emit (simulated for the test) -->
    <style data-optio-fouc="hero">
      [data-vp-block="hero"]:not([data-vp-variant="bold"]) {
        display: none !important;
      }
    </style>
    <style data-optio-fouc="pricing">
      [data-vp-block="pricing"]:not([data-vp-variant="cards"]) {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <section data-vp-block="hero" data-vp-variant="bold" class="hero-bold">
      <h1>BOLD HERO. ATTENTION.</h1>
      <p>The loud variant of the hero section.</p>
    </section>
    <section data-vp-block="hero" data-vp-variant="quiet" class="hero-quiet">
      <h1>Quiet, considered hero</h1>
      <p>A softer take on the same message.</p>
    </section>

    <section data-vp-block="pricing" data-vp-variant="cards">
      <h2>Pricing — cards layout</h2>
      <div class="pricing-cards">
        <div class="card">Starter</div>
        <div class="card">Pro</div>
        <div class="card">Enterprise</div>
      </div>
    </section>
    <section data-vp-block="pricing" data-vp-variant="table">
      <h2>Pricing — table layout</h2>
      <div class="pricing-table">
        <div class="row">Starter — $0</div>
        <div class="row">Pro — $19</div>
        <div class="row">Enterprise — talk to us</div>
      </div>
    </section>

    <div id="late-mount-slot"></div>

    <div class="controls">
      <button id="add-block" type="button">Add lazy block (SPA simulation)</button>
    </div>

    <script>
      document.getElementById("add-block").addEventListener("click", () => {
        const slot = document.getElementById("late-mount-slot");
        slot.innerHTML = `
          <style data-optio-fouc="footer">
            [data-vp-block="footer"]:not([data-vp-variant="minimal"]) { display: none !important; }
          </style>
          <section data-vp-block="footer" data-vp-variant="minimal" style="padding:24px;background:#f0f0f0">
            <p>Minimal footer</p>
          </section>
          <section data-vp-block="footer" data-vp-variant="full" style="padding:48px;background:#222;color:#fff">
            <p>Full footer with lots of links</p>
            <p>Newsletter signup, social, sitemap.</p>
          </section>
        `;
      });
    </script>

    <script src="../dist/optio.js"></script>
  </body>
</html>
